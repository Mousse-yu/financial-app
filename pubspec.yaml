name: financial_study_app
description: 理财+备考助手 - 个人理财与学习管理应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.0.0

  # 数据持久化
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 图表库
  fl_chart: ^0.66.0

  # 通知
  flutter_local_notifications: ^16.3.0
  permission_handler: ^11.2.0

  # 语音识别
  speech_to_text: ^6.1.1

  # 摄像头和图片
  image_picker: ^1.0.7

  # 分享和导出
  share_plus: ^7.2.1
  path_provider: ^2.1.2

  # 日期时间
  intl: ^0.19.0

  # 工具
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

